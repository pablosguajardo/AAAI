# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=C:/Users/pguajard/gradle-cacerts -Djavax.net.ssl.trustStorePassword=changeit

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# KSP compatibility with AGP 9.x built-in Kotlin
android.disallowKotlinSourceSets=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
