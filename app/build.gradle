plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    namespace = 'com.aaai.app'

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    androidResources {
        // The .dex files in assets/autoconv are read at runtime with AssetManager.open(),
        // which cannot handle compressed assets. Keep them uncompressed.
        noCompress '.dex'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    def localProperties = new Properties()
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    lint {
        disable 'MissingTranslation', 'ImpliedQuantity'
        abortOnError false
        checkReleaseBuilds true
    }

    compileSdkVersion 37

    signingConfigs {
        def storeLocation = localProperties['STORELOCATION']
        if (storeLocation && new File(storeLocation).exists()) {
            nuova {
                storeFile file(storeLocation)
                storePassword localProperties['STOREPASSWORD']
                keyAlias 'key3'
                keyPassword localProperties['KEYPASSWORD']
            }
        }
    }

    defaultConfig {
        applicationId = "com.aaai.app"
        minSdk = 24
        targetSdk = 37
        versionCode = 8
        versionName = "1.1.2"
        base.archivesName = "AAAI-" + versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Start.io test ads: avoid real impressions/clicks while developing
            manifestPlaceholders = [startappTestAds: "true"]
        }
        release {
            manifestPlaceholders = [startappTestAds: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('nuova')) {
                signingConfig signingConfigs.nuova
            }
        }
    }
}

configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.android.support', module: 'support-core-utils'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // Android Auto / Car App Library (CarAppService + templates para mostrar en head unit)
    implementation 'androidx.car.app:app:1.4.0'

    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'

    // HTTP client for APK downloads
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.5'

    // BouncyCastle (APK signing - kept for other uses)
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.82'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'

    // apksig: in-process APK signing (v2+v3, v1 disabled) - same approach as AAAD's JavaApkSigner
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Note: ARSCLib JAR must be placed in app/libs/ARSCLib.jar
    // Download from: https://github.com/REAndroid/ARSCLib/releases
    // The fileTree above picks it up automatically

    // Start.io ads (banner at the bottom of the app list)
    implementation 'com.startapp:inapp-sdk:5.5.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
